spring:
  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/XE
    username: ${ORACLE_USER:SYS} as sysdba
    password: ${ORACLE_PASS:oracle}
    driver-class-name: oracle.jdbc.OracleDriver
    # driver-class-name: org.sqlite.JDBC
    # DriverManager automatically selects driver className since JDBC4 (SDK6)
  jpa:
    hibernate:
      ddl-auto: none # create, create-drop, validate, update, none; none allows app to load if db fails
#      dialect: org.hibernate.community.dialect.SQLiteDialect
#      naming.physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        # dialect: org.hibernate.community.dialect.SQLiteDialect
        # com.basics.dbsqlite.configuration.SqliteDialect
        # NOTE: JPA forces underscore for camelCase
