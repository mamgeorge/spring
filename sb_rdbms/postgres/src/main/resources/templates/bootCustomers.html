<!DOCTYPE html>
<html xmlns = "http://www.w3.org/1999/xhtml" xmlns:th = "https://www.thymeleaf.org">
<head><title>List</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
	<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
	<style>.grayish { background-color: #d0d0d0d; }</style>
</head>
<body><!-- customer_id, store_id, first_name, last_name, email, address_id, activebool, create_date, last_update, active -->
<div th:replace="~{/bootHead :: bootHeadLinks}"> </div>

<div class="container-fluid text-center">
	<div class="row content">
		<div th:replace="~{/bootMenu :: bootMenuLinks}"> </div>

		<div class="col-sm-8 text-left">
			<h1>Customer List!</h1>
			<h5 th:text = "${#dates.formatISO(#dates.createNow())}"/>
			<br />

			<div style = "overflow:auto; height: 400px;">

				<table class = "table table-striped">
				<thead><span th:text="${'Total: ' + #lists.size(customers)}" /></thead>
				<tr>
					<th>idx</th>
					<th>id</th>
					<th>store</th>
					<th>name</th>
					<th>email</th>
					<th>address</th>
					<th>active?</th>
					<th>created</th>
					<th>updated</th>
					<th>active</th>
				</tr>
				<tr th:each="customer, ictr: ${customers}" >

					<td th:text="${ictr.index}" />
					<td th:text="${customer.customer_id}" />
					<td th:text="${customer.store_id}" />
					<td style = "white-space: nowrap;">
						<a th:href="@{|/bootCustomer/${customer.customer_id}|}" >
							<span th:text="|${customer.first_name} ${customer.last_name}|" />
						</a></td>
					<td th:text="${customer.email}" />
					<td th:text="${customer.address_id}" />
					<td th:text="${customer.activebool}" />
					<td th:text="${#dates.format(customer.create_date, 'yyyy/MM/dd')}" />
					<td style = "white-space: nowrap;"
						th:text="${#dates.format(customer.last_update, 'yyyy/MM/dd HH:mm')}" />
					<td th:text="${customer.active}" />
				</tr>
				</table>
			</div>

		</div>

		<div th:replace="~{/bootSide :: bootSideLinks}"> </div>
	</div>
</div>

<div th:replace="~{/bootFoot :: bootFootMsg}"> </div>

</body>
</html>
