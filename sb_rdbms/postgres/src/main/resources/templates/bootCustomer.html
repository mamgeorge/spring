<!DOCTYPE html>
<html xmlns = "http://www.w3.org/1999/xhtml" xmlns:th = "https://www.thymeleaf.org">
<head><title>Item</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
	<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
	<style>.grayish { background-color: #d0d0d0d; }</style>
</head>
<body>
<div th:replace="~{/bootHead :: bootHeadLinks}"> </div>

<div class="container-fluid text-center">
	<div class="row content">
		<div th:replace="~{/bootMenu :: bootMenuLinks}"> </div>

		<div class="col-sm-8 text-left">
			<h1>Customer Item!</h1>
			<h5 th:text = "${#dates.formatISO(#dates.createNow())}"/>
			<br />

			<table>
				<tr>
					<td th:text="${#dates.format(#dates.createNow(),'HH:mm:ss.SSSS')}" />
					<td th:text="${'Id: '	 + customer?.customer_id}?:'customer_id'" />
					<td th:text="${'Store: ' + customer?.store_id}?:'store_id'" />
				</tr>
				<tr>
					<td th:text="${'Name: ' + customer?.first_name}?:'first_name'" />
					<td />
					<td th:text="${customer?.last_name}?:'last_name'" />
				</tr>
				<tr>
					<td th:text="${'Email: '	 + customer?.email}?:'email'" />
					<td th:text="${'Addresss: '	 + customer?.address_id}?:'address_id'" />
					<td th:text="${'Active?: '	 + customer?.activebool}?:'activebool'" />
				</tr>
				<tr>
					<td th:text="${'Created: ' + customer?.create_date}?:'create_date'" />
					<td th:text="${'Updated: ' + customer?.last_update}?:'last_update'" />
					<td th:text="${'Active: ' + customer?.active}?:'active'" />
				</tr>
			</table>

			<hr>
			<h3>Test</h3><p>Lorem ipsum...</p>

		</div>

		<div th:replace="~{/bootSide :: bootSideLinks}"> </div>
	</div>
</div>

<div th:replace="~{/bootFoot :: bootFootMsg}"> </div>

</body>
</html>
