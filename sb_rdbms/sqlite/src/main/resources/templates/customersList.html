<!DOCTYPE html>
<html xmlns:th = "https://www.thymeleaf.org">
<head><title>customersList</title>
	<link rel = "stylesheet" th:href = "@{/basics.css}">
</head>
<body>

	<br/>
	<h3>customersList</h3>
	<br/><h5 th:text = "${#dates.formatISO(#dates.createNow())}"/>
	<br/><a th:href = "@{/}">return</a>
	<br/>
	<br/>
	<!--h5 th:text="${#dates.format(#dates.createNow(), 'yyyy/MM/dd HH:mm')}" /-->
	<div class = "divbox" style = "height: 400px; overflow: auto; width: 70%;">
		<table border = "1">
			<tr>
				<th>id</th>
				<th>name</th>
				<th>company</th>
				<th>address</th>
				<th>city</th>
				<th>phone</th>
				<th>email</th>
			</tr>

			<tr th:each = "customer: ${customers}">
				<td th:text = "${customer.customerid}"/>
				<td>
					<a th:href = "@{'/showCustomer/' + ${customer.customerid} }">
					<span th:text = "${customer.firstname} + ' ' + ${customer.lastname}" />
					</a>
				</td>
				<td th:text = "${customer.company}"/>
				<td th:text = "${customer.address}"/>
				<td th:text = "${customer.city}"/>
				<td th:text = "${customer.phone}"/>
				<td th:text = "${customer.email}"/>
			</tr>
		</table>
	</div>

</body>
</html>
