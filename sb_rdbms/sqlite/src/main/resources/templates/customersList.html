<!DOCTYPE html>
<html lang="en" xmlns:th = "http://www.thymeleaf.org">
<head><title>customersList</title>
	<meta charset="utf-8">
	<meta http-equiv = "keywords" content = "Customers Invoices" />
	<meta name = "viewport" content="width=device-width, initial-scale=1.0">
	<link href = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link type = "image/x-icon" rel = "shortcut icon" th:href = "@{images/george.gif}" />
	<link rel = "apple-touch-icon" href = "/images/george.gif"th:href = "@{images/george.gif}" />
	<!--link rel = "stylesheet" th:href = "@{/basics.css}"-->

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</head>
<body>
<div class = "container justify-content-center text-center">

<span th:insert="~{/bootHead :: boothead}"></span>

<h3>Spring List View!</h3>
	<h5 th:text = "${#dates.formatISO(#dates.createNow())}"></h5>

	<div class="justify-content-center" >
		Total: <span th:text="${#lists.size(customers)}"></span>
		<table class="table table-hover table-striped">
			<thead><tr>
			<th scope="col">id</th>
			<th scope="col">name</th>
			<th scope="col">company</th>
			<th scope="col">address</th>
			<th scope="col">city</th>
			<th scope="col">phone</th>
			<th scope="col">email</th>
			</tr></thead>
			<tbody class="table-group-divider">
			<tr th:each = "customer: ${customers}">
				<td th:text = "${customer.customerid}"/>
				<td>
					<a th:href = "@{'/showCustomer/' + ${customer.customerid} }" >
					<span th:text = "${customer.firstname} + ' ' + ${customer.lastname}" />
					</a>
				</td>
				<td th:text = "${customer.company}"/>
				<td th:text = "${customer.address}"/>
				<td th:text = "${customer.city}"/>
				<td th:text = "${customer.phone}"/>
				<td th:text = "${customer.email}"/>
			</tr>
		</table>
		</div>

<div th:insert="~{/bootFoot :: bootfoot}"></div>
</div>
</body></html>
