<!DOCTYPE html>
<html lang="en" xmlns:th = "http://www.thymeleaf.org">
<head><title>customerOne</title>
	<meta charset="utf-8">
	<meta http-equiv = "keywords" content = "Customers Invoices" />
	<meta name = "viewport" content="width=device-width, initial-scale=1.0">
	<link href = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link type = "image/x-icon" rel = "shortcut icon" th:href = "@{/images/george.gif}" />
	<link rel = "apple-touch-icon" th:href = "@{/images/george.gif}" />
	<!--link rel = "stylesheet" th:href = "@{/basics.css}"-->

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</head>
<body>
<div class = "container justify-content-center text-center">
	<nav class = "navbar navbar-expand-sm navbar-dark bg-dark fixed-top">
		<div class = "container-fluid">
			<a class="navbar-brand" href="#">
				<img th:src="@{/images/george.gif}" alt="MLG" style="width: 40px;" class="rounded-pill">
			</a>
			<a class = "navbar-brand" href = "/home" >Customer One</a>
			<button class = "navbar-toggler" type = "button" data-bs-toggle = "collapse" data-bs-target = "#mynavbar">
				<span class = "navbar-toggler-icon"></span>
			</button>
			<div class = "collapse navbar-collapse" id = "mynavbar">

				<ul class = "navbar-nav me-auto">
					<li class = "nav-item"><a class = "nav-link" href = "/showCustomers">list</a></li>
					<li class = "nav-item"><a class = "nav-link" href = "/showCustomersMax">🔵 max</a></li> |
					<li class = "nav-item"><a class = "nav-link" href = "/showCustomerRnd">🔵 random</a></li>
					<li class = "nav-item"><a class = "nav-link" href = "/showCustomer/10">🔵 customer_10</a></li>
				</ul>

				<form class="d-flex">
					<button class="btn btn-warning" value = "Testing"/>
				</form>
			</div>
		</div>
	</nav>
	<br /><br /><br />
	<h5 th:text = "${#dates.formatISO(#dates.createNow())}"/>
	<!--h5 th:text="${#dates.format(#dates.createNow(), 'yyyy/MM/dd HH:mm')}" /-->
	<h5>Thymeleaf</h5>
	<div class="justify-content-center">
	<table class="table table-hover table-striped">
		<thead><tr>
		<th scope="col">customerid</th>
		<th scope="col">name</th>
		<th scope="col">company</th>
		<th scope="col">address</th>
		<th scope="col">city</th>
		<th scope="col">phone</th>
		<th scope="col">email</th>
		</tr></thead>
		<tbody class="table-group-divider">
		<tr>
		<th scope="row" th:text = "${customer.customerid}"></th>
		<td th:text = "${customer.firstname} + ' ' + ${customer.lastname}"></td>
		<td th:text = "${customer.company}"></td>
		<td th:text = "${customer.address}"></td>
		<td th:text = "${customer.city}"></td>
		<td th:text = "${customer.phone}"></td>
		<td th:text = "${customer.email}"></td>
		</tr>
	</table>
	</div>

	<br/><!--a th:href = "@{/}">return</a-->

	<nav class="navbar navbar-expand-sm bg-dark navbar-dark fixed-bottom">

		<ul class = "navbar-nav me-auto">
			<li class = "nav-item"><a class = "nav-link" th:href = "@{/}">return</a></li>
		</ul>
	</nav>
	</div></div>
</body></html>
