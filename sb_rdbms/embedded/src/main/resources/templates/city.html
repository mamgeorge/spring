<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org" >
<head><title>city</title><meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
<!-- HEADER -->
<div th:replace = "~{/bootHead :: bootHeadLinks}"></div>

<!-- BODY -->

	<center>
	<table class = "table table-hover table-striped w-50">
	<tr><th>id			</th><td th:text = "${city.id}"			></td></tr>
	<tr><th>name		</th><td th:text = "${city.name}"		></td></tr>
	<tr><th>population	</th><td th:text = "${city.population}"	></td></tr>
	<tr><th>created		</th><td th:text = "${city.created}"	></td></tr>
	<tr><th>updated		</th><td th:text = "${city.updated}"	></td></tr>
	</table>
	</center>

<!-- FOOTER -->
<div th:replace = "~{/bootFoot :: bootFootLinks}"></div>

</body>
</html>
