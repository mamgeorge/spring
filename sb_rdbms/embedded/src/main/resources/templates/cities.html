<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org" >
<head><title>cities</title><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<style>.tabl { overflow: auto; height: 400px; width: 90%; }</style>

</head>

<body>
<!-- HEADER -->
<div th:replace = "~{/bootHead :: bootHeadLinks}"></div>

<!-- BODY -->
<center>
<div class = "tabl ms-40" >
<table class = "table table-striped">
<tr>
	<th scope = "col" >id			</th>
	<th scope = "col" >name			</th>
	<th scope = "col" >population	</th>
	<th scope = "col" >created		</th>
	<th scope = "col" >updated		</th>
	</tr>
<tr th:each = "city: ${cities}">
	<td th:text = "${city.id}"/>
	<td th:text = "${city.name}"/>
	<td th:text = "${city.population}"/>
	<td th:text = "${city.created}"/>
	<td th:text = "${city.updated}"/>
	</tr>
</table>
</div>
</center>

<!-- FOOTER -->
<div th:replace = "~{/bootFoot :: bootFootLinks}"></div>

</body>
</html>
