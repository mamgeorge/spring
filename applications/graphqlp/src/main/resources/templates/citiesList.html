<!DOCTYPE html>
<html xmlns = "http://www.w3.org/1999/xhtml"
	xmlns:th = "https://www.thymeleaf.org"
>
<head><title>cities</title>
	<meta charset = "utf-8">
	<meta name = "viewport" content = "width=device-width, initial-scale=1">
	<link href = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel = "stylesheet">
	<script src = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
<div class = "container p-1 bg-primary text-white text-center">
	<h3 th:text = "${#strings.capitalize('cities')}"/>
	<h5 th:text = "${#dates.formatISO(#dates.createNow())}"/>
	<a class = "text-white" th:href = "@{/}">return</a>
</div>

<div class = "container p-1 text-center" style = "height: 400px; overflow: auto;">
	<table class = "table table-striped">
		<thead class = "thead-dark"><span th:text = "'Total: ' + ${cities.size}"/>
		<tr>
			<th>idx</th>
			<th>city_id</th>
			<th>city</th>
			<th>country_id</th>
			<th>last_update</th>
		</tr>
		</thead>

		<tr th:each = "city, ictr: ${cities}">
			<td><span th:text = "${ictr.count}"/></td>
			<td><span th:text = "${city.city_id}"/></td>
			<td><a th:href = "@{/showCity/} + ${city.city_id}">
				<span th:text = "${city.city}"/></a></td>
			<td><span th:text = "${city.country_id}"/></td>
			<td style = "white-space: nowrap;"><span th:text = "${city.last_update}"/></td>
		</tr>
	</table>
</div>

</body>
</html>
