<!DOCTYPE html>
<html xmlns = "http://www.w3.org/1999/xhtml"
	xmlns:th = "https://www.thymeleaf.org"
>
<head><title>customer</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
<div class="container p-1 bg-primary text-white text-center">
	<h3 th:text = "${#strings.capitalize('customers')}" />
	<h5 th:text = "${#dates.formatISO(#dates.createNow())}"/>
	<a class = "text-white" th:href = "@{/}" >return</a>
</div>

<div class="container p-1 text-center" style = "height: 400px; overflow: auto;">
	<table class = "table table-striped">
		<thead class = "thead-dark" ><span th:text = "'Total: ' + ${customers.size}" />
		<tr>
			<th>idx</th>
			<th>customer_id</th>
			<th>store_id</th>
			<th>active</th>
			<th>activebool</th>
			<th>address_id</th>
			<th>email</th>
			<th>first_name</th>
			<th>last_name</th>
			<th>create_date</th>
			<th>last_update</th>
		</tr>
		</thead>

		<tr th:each="customer, ictr: ${customers}">
			<td><span th:text = "${ictr.count}"		/></td>
			<td><a th:href = "@{/showCustomer/} + ${customer.customer_id}" >
				<span th:text = "${customer.customer_id}"	/></a></td>
			<td><span th:text = "${customer.store_id}"		/></td>
			<td><span th:text = "${customer.active}"		/></td>
			<td><span th:text = "${customer.activebool}"	/></td>
			<td><span th:text = "${customer.address_id}"	/></td>
			<td><span th:text = "${customer.email}"			/></td>
			<td><span th:text = "${customer.first_name}"	/></td>
			<td><span th:text = "${customer.last_name}"		/></td>
			<td style = "white-space: nowrap;"><span th:text = "${customer.create_date}"	/></td>
			<td style = "white-space: nowrap;"><span th:text = "${customer.last_update}"	/></td>
		</tr>
	</table>
</div>

</body>
</html>
