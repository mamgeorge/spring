<!DOCTYPE html>
<html xmlns = "http://www.w3.org/1999/xhtml"
	xmlns:th = "https://www.thymeleaf.org"
>
<head><title>address</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
<div class="container p-1 bg-primary text-white text-center">
	<h3 th:text = "${#strings.capitalize('addresses')}" />
	<h5 th:text = "${#dates.formatISO(#dates.createNow())}"/>
	<a class = "text-white" th:href = "@{/}" >return</a>
</div>

<div class="container p-1 text-center" style = "height: 400px; overflow: auto;">
	<table class = "table table-striped">
		<thead class = "thead-dark" ><span th:text = "'Total: ' + ${addresses.size}" />
		<tr>
			<th>idx</th>
			<th>address_id</th>
			<th>address</th>
			<th>address2</th>
			<th>district</th>
			<th>city_id</th>
			<th>postal_code</th>
			<th>phone</th>
			<th>last_update</th>
		</tr>
		</thead>

		<tr th:each="address, ictr: ${addresses}">
			<td><span th:text = "${ictr.count}"		/></td>
			<td><span th:text = "${address.address_id}"		/></td>
			<td><a th:href = "@{/showAddress/} + ${address.address_id}" >
				<span th:text = "${address.address}"		/></a></td>
			<td><span th:text = "${address.address2}"		/></td>
			<td><span th:text = "${address.district}"		/></td>
			<td><span th:text = "${address.city_id}"		/></td>
			<td><span th:text = "${address.postal_code}"	/></td>
			<td><span th:text = "${address.phone}"			/></td>
			<td style = "white-space: nowrap;">
				<span th:text = "${address.last_update}" /></td>
		</tr>
	</table>
</div>

</body>
</html>
