<!DOCTYPE html>
<html xmlns = "http://www.w3.org/1999/xhtml"
	xmlns:th = "https://www.thymeleaf.org"
>
<head><title>actor</title>
	<meta charset = "utf-8">
	<meta name = "viewport" content = "width=device-width, initial-scale=1">
	<link href = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel = "stylesheet">
	<script src = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
<div class = "container p-1 bg-primary text-white text-center">
	<h3 th:text = "${#strings.capitalize('actors')}"/>
	<h5 th:text = "${#dates.formatISO(#dates.createNow())}"/>
	<a class = "text-white" th:href = "@{/}">return</a>
</div>

<div class = "container p-1 text-center" style = "height: 400px; overflow: auto;">
	<table class = "table table-striped">
		<thead class = "thead-dark"><span th:text = "'Total: ' + ${actors.size}"/>
		<tr>
			<th>idx</th>
			<th>actor_id</th>
			<th>name</th>
			<th>last_update</th>
		</tr>
		</thead>

		<tr th:each = "actor, ictr: ${actors}">
			<td><span th:text = "${ictr.count}"/></td>
			<td><span th:text = "${actor.actor_id}"/></td>
			<td><a th:href = "@{/showActor/} + ${actor.actor_id}">
				<span th:text = "${actor.first_name} + ' ' + ${actor.last_name}"/></a></td>
			<td style = "white-space: nowrap;">
				<span th:text = "${actor.last_update}"/></td>
		</tr>
	</table>
</div>

</body>
</html>
